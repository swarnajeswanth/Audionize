[build]
  command = "npm run build"
  publish = ".next"

[template.environment]
  NEXTAUTH_URL = "https://$DEPLOY_PRIME_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/auth/*"
  to = "/api/auth/[...nextauth]"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 